spring.application.name=newreyting

# PostgreSQL — ulanish ma'lumotlari muhit o'zgaruvchilari orqali beriladi (faylga
# haqiqiy parol yozilmaydi). Lokal ishga tushirishdan oldin o'rnating, masalan:
#   PowerShell: $env:POSTGRES_PASSWORD = 'sizning-parolingiz'
# Server'ga ko'chganda faqat shu 3 muhit o'zgaruvchisini yangilash kifoya.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/micco}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080

# JWT — production'da bu muhit o'zgaruvchisini albatta bering (kodga/faylga yozmang).
# Berilmasa JwtService har ishga tushishda xavfsiz tasodifiy kalit generatsiya qiladi
# (natijada qayta ishga tushirilganda barcha foydalanuvchilar chiqarib yuboriladi).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=720

# Frontend manzili (CORS uchun) — productionda CORS_ALLOWED_ORIGIN muhit o'zgaruvchisi orqali beriladi
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
