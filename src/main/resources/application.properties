spring.application.name=newreyting

# PostgreSQL (lokal) — server'ga ko'chganda faqat quyidagi 3 qatorni
# (yoki POSTGRES_URL/POSTGRES_USER/POSTGRES_PASSWORD muhit o'zgaruvchilarini) almashtirish kifoya.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/micco}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:root123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# JWT — DIQQAT: bu demo/dev uchun. Production'da bu qiymatni albatta
# muhit o'zgaruvchisi (JWT_SECRET) orqali bering, kodga/faylga yozmang.
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-in-production-please-1234567890}
app.jwt.expiration-minutes=720

# Frontend dev server manzili (CORS uchun)
app.cors.allowed-origin=http://localhost:5173
