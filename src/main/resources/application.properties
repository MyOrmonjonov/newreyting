spring.application.name=newreyting

# H2 fayl bazasi (mahalliy rivojlantirish uchun) — D:/newreyting/data/newreyting.mv.db faylida saqlanadi
spring.datasource.url=jdbc:h2:file:./data/newreyting;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 konsolini brauzerdan ko'rish uchun: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# JWT — DIQQAT: bu demo/dev uchun. Production'da bu qiymatni albatta
# muhit o'zgaruvchisi (JWT_SECRET) orqali bering, kodga/faylga yozmang.
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-in-production-please-1234567890}
app.jwt.expiration-minutes=720

# Frontend dev server manzili (CORS uchun)
app.cors.allowed-origin=http://localhost:5173
